<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<header>
    <h1 class="display-4 d-flex justify-content-center mt-5 mb-5">DOM y eventos en JavaScript
</header>

<body>

    <div class="container p-5 card border-danger bg-light mt-5">

        </h1>
        <h2 class="mt-5">Ejercicio 11: Formulario de registro con validación
        </h2>
        <div class="row mt-2">
            <div class="col">
                <div class="card align-items-center w-100 g-4">
                    <form class="mt-3 ml-5" action="">
                        <label for="nombre">Nombre.</label>
                        <input id="nombre" class="form-control" type="text">
                        <p id="p1"></p>

                        <label for="correo">Correo.</label>
                        <input id="correo" class="form-control" type="email">
                        <p id="p2"></p>

                        <label for="edad">Edad.</label>
                        <input id="edad" class="form-control" type="number">
                        <p id="p3"></p>

                        <p id="p4"></p>

                        <button type="button" class="btn btn-success mt-3 ml-5 mb-5"
                            onclick="registrar()">Registrarme</button>


                    </form>

                </div>
            </div>
            <div class="col-4">

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"

    <script src="js/ejercicio11.js"></script>
