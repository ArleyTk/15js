<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<header>
    <h1 class="display-4 d-flex justify-content-center mt-5 mb-5">DOM y eventos en JavaScript
</header>

<body>
    <div class="container p-5 card border-danger bg-light">

        </h1>
        <h2 class="mt-5">Ejercicio 1: Saludo personalizado
        </h2>
        <div class="row mt-2">
            <div class="col">

                <input type="text" id="nombre" class="form-control border-dark  " aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-lg">
                <button onclick="saludar()" class="btn btn-success mt-4">Saludar</button>

            </div>
            <div class="card mt-5 border-3 border-secondary">
                <div class="card-body">
                    <p id="saludo"></p>
                </div>
            </div>


        </div>
    </div>

    <div class="container p-5 card border-danger bg-light mt-5">

        </h1>
        <h2 class="mt-5">Ejercicio 2: Contador de clics
        </h2>
        <div class="row mt-2">
            <div class="col">

                <button onclick="sumar()" class="btn btn-success mt-4">Sumar clic</button>
                <button onclick="reiniciar()" class="btn btn-secondary mt-4">Reiniciar</button>

            </div>
            <div class="col">
                <div class="mt-5">
                    <div class="card-body">
                        <h1 class="display-1 d-flex justify-content-center" id="numero"></h1>
                    </div>
                </div>
            </div>



        </div>
    </div>

    <div class="container p-5 card border-danger bg-light mt-5">

        </h1>
        <h2 class="mt-5">Ejercicio 3: Vista previa de texto
        </h2>
        <div class="row mt-2">
            <div class="col">

                <input type="text" id="evento" class="form-control border-dark" aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-lg">

            </div>
            <div class="card mt-5 border-3 border-secondary">
                <div class="card-body">
                    <p id="parrafo"></p>
                </div>
            </div>


        </div>
    </div>

    <div class="container p-5 card border-danger bg-light mt-5">

        </h1>
        <h2 class="mt-5">Ejercicio 4: Cambiador de color
        </h2>
        <div class="row mt-2">
            <div class="col">
                <select name="" id="select">
                    <option value="normal" selected>Normal</option>
                    <option value="blue">Azul</option>
                    <option value="green">Verde</option>
                    <option value="yellow">Amarillo</option>
                    <option value="pink">Rosa</option>
                </select>
                <div class=" border-dark tarjeta mt-4" id="tarjeta">

                </div>
            </div>


        </div>
    </div>

    <div class="container p-5 card border-danger bg-light mt-5">

        </h1>
        <h2 class="mt-5">Ejercicio 5: Mensaje al presionar Enter
        </h2>
        <div class="row mt-2">
            <div class="col">

                <input type="text" id="input-area" class="form-control border-dark" aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-lg" placeholder="Escribe una tarea">
            </div>
            <div class="card mt-5 border-3 border-secondary">
                <div class="card-body">
                    <p id="area"></p>
                </div>
            </div>


        </div>
    </div>

    <div class="container p-5 card border-danger bg-light mt-5">

        </h1>
        <h2 class="mt-5">Ejercicio 6: Calculadora de IMC
        </h2>
        <div class="row mt-2">
            <div class="col">
                <label for="">peso en kilogramos.</label>
                <input type="text" id="kilogramos" class="mb-4 form-control border-dark  " aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-lg">
                <label for="">estatura en metros.</label>
                <input type="text" id="metros" class="form-control border-dark  " aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-lg">
                <button onclick="calcular()" class="btn btn-success mt-4">Calcular IMC</button>

            </div>
            <div class="card mt-5 border-3 border-secondary">
                <div class="card-body">
                    <p id="textoimc"></p>
                </div>
            </div>


        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="js/ejercicio1.js"></script>
    <script src="js/ejercicio2.js"></script>
    <script src="js/ejercicio3.js"></script>
    <script src="js/ejercicio4.js"></script>
    <script src="js/ejercicio5.js"></script>
    <script src="js/ejercicio6.js"></script>
</body>

</html>
